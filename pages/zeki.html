<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зона</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/weather.css">
    <link rel="stylesheet" href="../css/employee.css">
    <link rel="stylesheet" href="../css/zeki.css">
    <link rel="stylesheet" href="../css/zeki.css">
</head>

<body>
    <header class="header">
        <div class="header-row">
            <a href="../index.html">
                <div class="header-title">
                    <div class="header-title-img">
                        <img src="../img/logo.svg" alt="Logo">
                    </div>
                    <div class="header-title-text">Зона.com</div>
                </div>
            </a>
            <nav class="header-nav">
                <ul>
                    <li><a href="./news.html">Новости</a></li>
                    <li><a href="./employee.html">Сотрудники</a></li>
                    <li><a href="./zeki.html">Пидорятня</a></li>
                </ul>
            </nav>

            <button class="header-btn" type="button">
                <a href="./form.html">
                    <div class="btn">Сесть</div>
                </a>
            </button>
        </div>

    </header>

    <main>
        <div class="container">
            <div class="zeki">
                <div class="card">
                    <div class="card-left">
                        <h1 class="card-title">Добро пожаловать в пидорятню!</h1>

                    </div>
                    <div class="video-container">
                        <video src="../video/pidor.mp4" class="video"></video>
                        <div class="overlay">
                            <button class="video-button">
                                <img src="../img/play-white.svg" alt="Play" class="btn-icon"
                                    data-play-src="../img/play-white.svg" data-pause-src="../img/pause-white.png">
                            </button>
                        </div>
                    </div>
                </div>
                <h1 class="zeki-title">Наши зеки</h1>
                <div class="zeki-container">
                    <div class="zeki-card">
                        <img src="../img/news/asliddin.jpg" alt="Asliddin" class="zeki-img">
                        <div class="employee-name">Аслиддин Нурматов</div>
                        <div class="employee-info">Главный опущенный</div>
                    </div>

                    <div class="zeki-card">
                        <img src="../img/zeki/leonov.jpg" alt="Leonov" class="zeki-img">
                        <div class="employee-name">Владимир Леонов</div>
                        <div class="employee-info">Петух в пальте</div>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <footer class="footer">ООО «Зона». Все права нарушены ©</footer>
    <script src="../js/main.js"></script>
</body>

</html>
